name: Build AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Oldest supported LTS = oldest glibc = AppImage runs everywhere newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A tag whose APP_VERSION does not match it ships a build that reports
      # the OLD version while the release advertises the new one. Every user
      # then updates, stays on the old version, and is offered the same update
      # forever. Fail the build instead.
      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"(.+)\"', open('tclauncher/version.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag APP_VERSION=$v"
          if [ "$v" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $v"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps (Qt runtime for icon conversion, libfuse2 for appimagetool)
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libegl1 libgl1 libxkbcommon0
      - name: Run tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/python -m pytest -q
      - name: Build AppImage
        run: scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TCLauncher-AppImage
          path: dist/TCLauncher-*-x86_64.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TCLauncher-*-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # See the note in the AppImage job: a tag/APP_VERSION mismatch ships a
      # build that can never stop offering its own update.
      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path tclauncher/version.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME -replace '^v',''
          Write-Host "tag=$tag APP_VERSION=$v"
          if ($v -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $v" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The script makes its own .venv-win, runs pytest, and refuses to build
      # if the suite fails.
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TCLauncher-Windows
          path: dist/launcher.exe
      # The asset name is load-bearing and must stay exactly "launcher.exe":
      # updater.pick_asset() matches the Windows asset by string equality, so
      # any other name breaks self-update silently. The AppImage above is
      # matched by suffix instead and keeps its version -- deliberately
      # asymmetric; do not unify them.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/launcher.exe
